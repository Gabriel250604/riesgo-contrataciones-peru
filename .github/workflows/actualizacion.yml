name: Actualizacion mensual

on:
  schedule:
    - cron: "0 11 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install duckdb==1.5.6 dbt-core==1.12.5 dbt-duckdb==1.11.0

      - name: Descargar datos del OECE
        run: python src/ingesta.py

      - name: Construir modelo y pruebas
        working-directory: transformacion
        run: dbt build --profiles-dir .

      - name: Publicar datos del tablero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/datos
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualizacion de datos $(date -u +%Y-%m-%d)"
            git push
          fi
